global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'haproxy'
    static_configs:
      - targets: ['haproxy-exporter:9101']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'app1'
    static_configs:
      - targets: ['app1:5001']

  - job_name: 'app2'
    static_configs:
      - targets: ['app2:5002']

  - job_name: 'app3'
    static_configs:
      - targets: ['app3:5003']


